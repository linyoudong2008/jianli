<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面描述：用于搜索引擎与分享卡片展示 -->
  <meta name="description" content="林有栋的个人在线简历与作品集：五邑大学交通工程专业，掌握 Python 编程、SolidWorks 设计与 AI 编程相关技术，独立开发过飞机大战小游戏。">
  <title>林有栋 · 个人简历</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       页头（吸顶）：左侧小标识，右侧板块导航点
       滚动后常驻顶部，导航点实时指示当前浏览的卡片
  ============================================================ -->
  <header class="site-header">
    <div class="container header-inner">
      <p class="header-mark">林有栋<span aria-hidden="true"> · 简历</span></p>
      <div class="header-right">
        <!-- 导航点由 js/main.js 根据卡片数据生成 -->
        <nav class="section-nav" id="sectionNav" aria-label="内容板块导航"></nav>
        <!-- 自定义主题色：调色板图标触发，打开玻璃面板实时改 bg/ink/primary 三维度 -->
        <button class="theme-trigger" id="themeTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="themePanel" data-tooltip="自定义主题色">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="13.5" cy="6.5" r="1.3" fill="currentColor"/>
            <circle cx="17.5" cy="10.5" r="1.3" fill="currentColor"/>
            <circle cx="17.5" cy="15.5" r="1.3" fill="currentColor"/>
            <circle cx="13.5" cy="19.5" r="1.3" fill="currentColor"/>
            <path d="M12 22a10 10 0 1 1 10-10c0 2.5-2 3.5-4 3.5h-2.5a1.5 1.5 0 0 0 0 3A2.5 2.5 0 0 1 12 22Z"/>
          </svg>
        </button>
        <!-- 导出可打印 PDF：一键触发 window.print()，浏览器选"另存为 PDF" -->
        <button class="print-btn" id="printBtn" type="button" aria-label="导出简历为可打印 PDF">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span>导出 PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主题自定义面板（玻璃浮层）：3 个颜色组 —— 背景色 / 文字色 / 主题色 + 保存/恢复默认 -->
  <section class="theme-panel" id="themePanel" role="dialog" aria-modal="false" aria-label="自定义主题颜色" hidden>
    <h3>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4Z"/></svg>
      自定义主题色
    </h3>
    <div class="cp-row">
      <label for="cp-bg">背景色</label>
      <input class="cp-input" id="cp-bg" type="color" value="#F4F7FB" aria-label="背景色选择">
      <input class="cp-hex"   id="cp-bg-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="背景色 HEX">
    </div>
    <div class="cp-row">
      <label for="cp-ink">文字色</label>
      <input class="cp-input" id="cp-ink" type="color" value="#1F2937" aria-label="文字色选择">
      <input class="cp-hex"   id="cp-ink-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="文字色 HEX">
    </div>
    <div class="cp-row">
      <label for="cp-primary">主题色</label>
      <input class="cp-input" id="cp-primary" type="color" value="#3B66A8" aria-label="主题色选择">
      <input class="cp-hex"   id="cp-primary-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="主题色 HEX">
    </div>
    <div class="cp-actions">
      <button class="cp-btn" id="cpReset" type="button">恢复默认</button>
      <button class="cp-btn cp-btn-primary" id="cpSave" type="button">保存</button>
    </div>
  </section>

  <main>
    <div class="container">

      <!-- ============================================================
           首屏刊头：杂志式层级——眉题 → 姓名大字 → 一句话定位 → 联系方式
           3 秒内说清「你是谁 + 你能干嘛 + 怎么找你」
      ============================================================ -->
      <section class="hero" aria-label="个人简介与联系方式">
        <p class="eyebrow">个人简历 · 作品集</p>
        <h1 class="hero-name">林有栋</h1>
        <p class="hero-title">五邑大学 · 交通工程专业</p>
        <p class="hero-line">
          会用 <strong>Python</strong>、<strong>SolidWorks</strong> 和 AI 编程相关技术
          把想法做成能跑的作品——已经能用<strong>优化提示词</strong>制作流畅游戏，未来对 AI 与人文交互充满期待，但不限于此，希望能手动参与规模化建设。
        </p>
        <div class="hero-contact">
          <!-- 内联 SVG 小图标，避免引入整包图标库 -->
          <a class="contact-chip" href="tel:17841195675">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.2a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>
            17841195675
          </a>
          <a class="contact-chip" href="mailto:2375049257@qq.com">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            2375049257@qq.com
          </a>
        </div>
        <!-- 视觉引导：向下滑动浏览全部板块 -->
        <p class="scroll-hint" aria-hidden="true">
          向下滑动
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>
        </p>
      </section>

      <!-- ============================================================
           卡片栅栏：Flex 横向换行布局，默认 3 列（响应式变 2/1 列）
           卡片内容由 js/main.js 集中渲染，内容与结构分离、便于维护
      ============================================================ -->
      <section aria-label="简历内容">
        <ul class="card-grid" id="cardGrid"></ul>
      </section>

    </div>
  </main>

  <!-- 页脚：浅色细线分隔 -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 林有栋 · 个人在线简历</p>
    </div>
  </footer>

  <!-- ============================================================
       全屏详情弹窗：毛玻璃遮罩 + 弹性缩放入场
       点击遮罩 / 关闭按钮 / 按 ESC 键均可关闭
  ============================================================ -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-scroll">
        <div class="modal-head">
          <h2 id="modalTitle">详情</h2>
          <button class="modal-close" id="modalClose" type="button" data-close aria-label="关闭弹窗">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <!-- 弹窗正文由 js/main.js 按卡片数据填充（图文混排，可滚动） -->
        <div class="modal-content" id="modalContent"></div>
      </div>
    </div>
  </div>

  <!-- 图片灯箱：点击弹窗内图片后全屏查看，支持左右切换 -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-btn lightbox-close" id="lightboxClose" type="button" aria-label="关闭图片">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" id="lightboxPrev" type="button" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-btn lightbox-next" id="lightboxNext" type="button" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <!-- 轻提示 Toast：保存主题/恢复默认/非法输入 提示（默认隐藏，JS 动态加 .show） -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- 运行时配置（必须在 main.js 之前加载）——把本地私有 js/config.json 合并到 window.APP_CONFIG，禁止在任何入库脚本中硬编码任何密钥/Token -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
